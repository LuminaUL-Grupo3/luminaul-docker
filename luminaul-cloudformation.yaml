AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LuminaUL - Plantilla de AWS CloudFormation para despliegue automatizado en AWS Academy.
  Orquesta la creacion de Security Group, Instancia EC2 (Ubuntu 24.04 LTS), memoria SWAP,
  instalacion de Docker, integracion con DuckDNS, servicio de correo real via SMTP y
  arranque automatico con Caddy TLS (Zero-Configuration / Cero 'nano').

# ==============================================================================
# METADATOS DE INTERFAZ (AGRUPACION VISUAL EN CONSOLA AWS)
# ==============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Red y Dominio Publico (DuckDNS)"
        Parameters:
          - DuckDnsSubdomain
          - DuckDnsToken
          - KeyName
      - Label:
          default: "2. Correo Electronico Real (SMTP Obligatorio para codigos OTP)"
        Parameters:
          - SmtpUser
          - SmtpPassword
          - SmtpHost
          - SmtpPort
          - SmtpSecure
          - MailFrom
      - Label:
          default: "3. Ramas de GitHub y Despliegue"
        Parameters:
          - FrontendBranch
          - BackendBranch
      - Label:
          default: "4. Parametros Avanzados (Opcional - Ya vienen con valores por defecto)"
        Parameters:
          - JwtSecret
          - OpenAiApiKey
          - InstanceType
          - LatestUbuntuAmiId

    ParameterLabels:
      DuckDnsSubdomain:
        default: "Subdominio DuckDNS"
      DuckDnsToken:
        default: "Token de DuckDNS"
      KeyName:
        default: "Nombre del Key Pair (.pem)"
      SmtpUser:
        default: "Correo Remitente SMTP (ej: tu-cuenta@gmail.com)"
      SmtpPassword:
        default: "Contraseña de Aplicacion SMTP (16 caracteres)"
      SmtpHost:
        default: "Servidor SMTP"
      SmtpPort:
        default: "Puerto SMTP"
      SmtpSecure:
        default: "Conexion Segura SSL/TLS directa (SMTP_SECURE)"
      MailFrom:
        default: "Cabecera Remitente (MAIL_FROM)"
      FrontendBranch:
        default: "Rama de GitHub para Frontend"
      BackendBranch:
        default: "Rama de GitHub para Backend"
      JwtSecret:
        default: "Secreto JWT de Sesion"
      OpenAiApiKey:
        default: "OpenAI API Key (Opcional - Moderacion IA)"
      InstanceType:
        default: "Tipo de Instancia EC2"

# ==============================================================================
# PARAMETROS DE ENTRADA
# ==============================================================================
Parameters:
  KeyName:
    Description: 'Nombre del Key Pair (.pem) previamente creado en tu consola de AWS EC2'
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: 'Debe ser el nombre exacto de un Key Pair existente.'

  DuckDnsSubdomain:
    Description: 'Subdominio registrado en DuckDNS (solo el nombre, sin .duckdns.org). Ejemplo: luminaul'
    Type: String
    Default: 'luminaul'

  DuckDnsToken:
    Description: 'Token alfanumerico de tu cuenta de DuckDNS (obtenido en https://www.duckdns.org)'
    Type: String
    NoEcho: true

  # Parametros obligatorios de correo SMTP
  SmtpUser:
    Description: 'Correo electronico emisor para envio de codigos OTP a los alumnos (ej: soporte.luminaul@gmail.com)'
    Type: String

  SmtpPassword:
    Description: 'Contraseña de aplicacion generada en tu proveedor de correo (ej: 16 letras de Google App Passwords)'
    Type: String
    NoEcho: true

  SmtpHost:
    Description: 'Servidor SMTP saliente'
    Type: String
    Default: 'smtp.gmail.com'

  SmtpPort:
    Description: 'Puerto del servidor SMTP (587 para STARTTLS | 465 para SSL directo)'
    Type: Number
    Default: 587

  SmtpSecure:
    Description: 'true para puerto 465 (SSL/TLS directo), false para puerto 587 (STARTTLS)'
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'

  MailFrom:
    Description: 'Nombre y direccion que veran los estudiantes al recibir el correo de verificacion'
    Type: String
    Default: 'LuminaUL <soporte@luminaul.pe>'

  FrontendBranch:
    Description: 'Rama del repositorio luminaul-frontend a compilar (ej: main o feature/mobile-PWA)'
    Type: String
    Default: 'main'

  BackendBranch:
    Description: 'Rama del repositorio luminaul-new-backend a compilar'
    Type: String
    Default: 'main'

  JwtSecret:
    Description: 'Clave secreta HS256 para firmar tokens JWT (minimo 32 caracteres - usa valor por defecto si no deseas cambiarlo)'
    Type: String
    Default: 'LuminaULSecretKeyAleatoriaMinimo32Caracteres2026!'
    NoEcho: true
    MinLength: 32

  OpenAiApiKey:
    Description: 'Clave de OpenAI para moderacion semantica opcional (dejar en blanco para desactivar)'
    Type: String
    Default: ''
    NoEcho: true

  InstanceType:
    Description: 'Tipo de instancia EC2 compatible con AWS Academy'
    Type: String
    Default: 't3.small'
    AllowedValues:
      - 't3.small'
      - 't3.micro'
      - 't2.micro'

  LatestUbuntuAmiId:
    Description: 'Resolucion dinamica de la AMI oficial mas reciente de Ubuntu 24.04 LTS'
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'

# ==============================================================================
# RECURSOS DE INFRAESTRUCTURA
# ==============================================================================
Resources:

  # 1. Grupo de Seguridad (Firewall)
  LuminaulSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Reglas de acceso para LuminaUL (SSH, HTTP, HTTPS)'
      SecurityGroupIngress:
        # Puerto 22: Acceso administrativo por SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'Acceso SSH'
        # Puerto 80: Trafico Web y desafio ACME Let s Encrypt de Caddy
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP y validacion ACME Let s Encrypt'
        # Puerto 443: Trafico Seguro HTTPS con certificado oficial
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS Seguro'
      Tags:
        - Key: Name
          Value: luminaul-sg

  # 2. Instancia EC2 con aprovisionamiento automatico (UserData)
  LuminaulEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Ref LatestUbuntuAmiId
      SecurityGroupIds:
        - !GetAtt LuminaulSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 25
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: luminaul-production-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          echo "=========================================================="
          echo "Iniciando despliegue automatizado de LuminaUL en AWS"
          echo "=========================================================="

          # 1. Crear memoria SWAP de 4GB para evitar Out-Of-Memory en el build
          echo "--> [1/7] Configurando memoria SWAP..."
          fallocate -l 4G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # 2. Instalar Docker Engine y Docker Compose Plugin
          echo "--> [2/7] Instalando Docker CE y herramientas..."
          apt-get update
          apt-get install -y ca-certificates curl gnupg git
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          usermod -aG docker ubuntu

          # 3. Clonar repositorio de despliegue
          echo "--> [3/7] Clonando luminaul-docker..."
          cd /home/ubuntu
          git clone https://github.com/LuminaUL-Grupo3/luminaul-docker.git
          cd luminaul-docker

          # 4. Generar archivo .env automatico (DB_PASSWORD por defecto, SMTP configurado)
          echo "--> [4/7] Generando .env automatico desde CloudFormation..."
          cat << 'ENVEOF' > .env
          # Base de Datos PostgreSQL (Credenciales por defecto)
          DB_USER=postgres
          DB_PASSWORD=LuminaSecurePass2026!
          DB_NAME=luminaul
          DB_PORT=5432

          # Seguridad y Sesion JWT
          JWT_SECRET=${JwtSecret}
          JWT_EXPIRES_IN=86400

          # Dominio DuckDNS, CORS y WebSockets
          DOMAIN=${DuckDnsSubdomain}.duckdns.org
          DUCKDNS_SUBDOMAIN=${DuckDnsSubdomain}
          DUCKDNS_TOKEN=${DuckDnsToken}
          WEB_ORIGIN=https://${DuckDnsSubdomain}.duckdns.org,http://${DuckDnsSubdomain}.duckdns.org,http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1

          # Servicio de Correo Real via SMTP
          MAIL_TRANSPORT=smtp
          SMTP_HOST=${SmtpHost}
          SMTP_PORT=${SmtpPort}
          SMTP_SECURE=${SmtpSecure}
          SMTP_USER=${SmtpUser}
          SMTP_PASSWORD=${SmtpPassword}
          MAIL_FROM="${MailFrom}"

          # Moderacion Semantica con IA (Opcional)
          OPENAI_API_KEY=${OpenAiApiKey}

          # Ramas de GitHub a construir
          BACKEND_BRANCH=${BackendBranch}
          FRONTEND_BRANCH=${FrontendBranch}
          ENVEOF

          # Asegurar permisos del archivo .env y el repositorio
          chown -R ubuntu:ubuntu /home/ubuntu/luminaul-docker
          chmod 600 .env

          # Actualizar el Caddyfile descargado con el subdominio DuckDNS
          if [ -f Caddyfile ]; then
            sed -i "s|{\$DOMAIN:localhost}|${DuckDnsSubdomain}.duckdns.org|g" Caddyfile
          fi

          # 5. Registrar IP inicial en DuckDNS
          echo "--> [5/7] Reportando IP actual a DuckDNS..."
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com || curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          curl -s "https://www.duckdns.org/update?domains=${DuckDnsSubdomain}&token=${DuckDnsToken}&ip=$PUBLIC_IP"
          sleep 5

          # 6. Crear Servicio Systemd para arranque e IP dinamica en cada encendido
          echo "--> [6/7] Creando servicio systemd persistente..."
          cat << 'SVCEOF' > /etc/systemd/system/luminaul.service
          [Unit]
          Description=LuminaUL Docker Compose Application
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/home/ubuntu/luminaul-docker
          User=ubuntu
          Group=docker
          ExecStartPre=/bin/bash -c 'set -a; [ -f /home/ubuntu/luminaul-docker/.env ] && . /home/ubuntu/luminaul-docker/.env; set +a; IP=$(curl -s http://checkip.amazonaws.com || curl -s http://169.254.169.254/latest/meta-data/public-ipv4); if [ -n "$IP" ] && [ -n "$DUCKDNS_SUBDOMAIN" ] && [ -n "$DUCKDNS_TOKEN" ]; then curl -s "https://www.duckdns.org/update?domains=$DUCKDNS_SUBDOMAIN&token=$DUCKDNS_TOKEN&ip=$IP"; sleep 5; fi'
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          systemctl daemon-reload
          systemctl enable luminaul.service
          systemctl enable docker

          # 7. Compilar de forma secuencial (evita saturar CPU/RAM) y levantar servicios
          echo "--> [7/7] Compilando y levantando contenedores Docker..."
          cd /home/ubuntu/luminaul-docker
          docker compose build backend
          docker compose build frontend
          systemctl start luminaul.service

          echo "=========================================================="
          echo "Despliegue completado con exito. LuminaUL esta activo."
          echo "=========================================================="

# ==============================================================================
# SALIDAS (OUTPUTS)
# ==============================================================================
Outputs:
  InstanceId:
    Description: 'ID de la Instancia EC2 creada'
    Value: !Ref LuminaulEC2Instance

  PublicIpAddress:
    Description: 'Direccion IP publica inicial de la instancia'
    Value: !GetAtt LuminaulEC2Instance.PublicIp

  PublicApplicationUrl:
    Description: 'URL publica oficial con HTTPS y certificado SSL valido'
    Value: !Sub 'https://${DuckDnsSubdomain}.duckdns.org'

  SSHCommand:
    Description: 'Comando para conectarse por SSH al servidor desde tu terminal'
    Value: !Sub 'ssh -i "${KeyName}.pem" ubuntu@${LuminaulEC2Instance.PublicIp}'
