services:
  postgres:
    image: postgres:16-alpine
    container_name: luminaul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-luminaul}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Semillado automático en la primera inicialización:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - luminaul-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-luminaul}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: https://github.com/LuminaUL-Grupo3/luminaul-new-backend.git#${BACKEND_BRANCH:-main}
      args:
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
    image: luminaul-backend:production
    container_name: luminaul-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-luminaul}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-luminaul-development-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,https://localhost,https://127.0.0.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luminaul-net

  frontend:
    build:
      context: https://github.com/LuminaUL-Grupo3/luminaul-frontend.git#${FRONTEND_BRANCH:-main}
      args:
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
    image: luminaul-frontend:production
    container_name: luminaul-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - luminaul-net

volumes:
  postgres_data:
    name: luminaul-postgres-data
  caddy_data:
    name: luminaul-caddy-data
  caddy_config:
    name: luminaul-caddy-config

networks:
  luminaul-net:
    name: luminaul-network
    driver: bridge
